name: Three Adventure SEO refresh
on:
  push:
    paths:
      - .github/workflows/three-adventure-seo-refresh.yml
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Three Adventure page
        env:
          HEAD_B64: 
          FOOTER_B64: 
          INLINE_B64: 
          HERO_B64: YWx0PSJDYXJuaXZhbCBnYW1lcyBhbmQgZXZlbnQgZW50ZXJ0YWlubWVudCBzZXR1cCBieSBUaHJlZSBBZHZlbnR1cmUgaW4gRG9oYSwgUWF0YXIiIHdpZHRoPSIxOTIwIiBoZWlnaHQ9IjEwODAiIGZldGNocHJpb3JpdHk9ImhpZ2giIGxvYWRpbmc9ImVhZ2VyIiBkZWNvZGluZz0iYXN5bmMi
        run: |
          python - <<'PY2'
          from pathlib import Path
          import base64,re,os
          p=Path('three-adventure/index.html')
          s=p.read_text(encoding='utf-8')
          d=lambda k:base64.b64decode(os.environ[k]).decode()
          s=re.sub(r'<head>.*?</head>',d('HEAD_B64'),s,count=1,flags=re.S)
          s=s.replace('alt="Three Adventure carnival entertainment" width="1920" height="1080" fetchpriority="high"',d('HERO_B64'))
          s=re.sub(r'<div class="wrap bottom">.*?</div>(?=\s*</footer>)',d('FOOTER_B64'),s,count=1,flags=re.S)
          inline='<script>'+d('INLINE_B64')+'</script>'
          s=s.replace('<script src="./script.js"></script>',inline+'<script src="./script.js"></script>',1)
          p.write_text(s,encoding='utf-8')
          PY2
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/three-adventure-seo-refresh.yml
          git add three-adventure/index.html .github/workflows/three-adventure-seo-refresh.yml
          git commit -m "Upgrade Three Adventure SEO, FAQ and testimonials"
          git push
